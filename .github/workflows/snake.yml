name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#bf91f3&color_dots=#ebedf0,#c6d4f5,#93b0ef,#5f86e0,#3d59a1
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#bf91f3&color_dots=#1a1b27,#2e3a6b,#3d59a1,#5a7fd1,#70a5fd

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
